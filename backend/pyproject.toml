[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "county-health-normalize"
version = "0.1.0"
description = "Normalize and validate public health case-report data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pandera>=0.21",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["county_health_normalize*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
